[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-ml-ops"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "azure-ai-ml>=1.24,<2",
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "mlflow>=2.17,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
