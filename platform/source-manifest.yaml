capabilities:
  ml:
    features:
    - training
    - evaluation
    - registry
    - batch_serving
    - evidence
    provider: azure_ml
cost_policy:
  cloud_execution_requires_approval: true
  default_max_nodes: 1
  permit_spot_training: true
  retain_idle_clusters: false
environments:
- dev
execution:
  batch:
    cloud_fallback:
      enabled: false
    provider: local
  development:
    containerized: true
    provider: local
  training:
    cloud_fallback:
      enabled: false
    provider: local
infrastructure:
  azure:
    provider: terraform
manifest_schema_version: '1.0'
platform_version: 1.0.0
policy:
  allow_cross_subscription_backend: false
  allowed_regions:
  - eastus
  capability_maturity: allow_preview
  data_classification: internal
  deployment_approval: manual_dispatch_with_plan_digest
  evidence_retention_days: 90
