name: Check for input drift
on:
  workflow_dispatch:
    inputs:
      cloud_compute_authorization:
        description: Type RUN_AZURE_DRIFT_CHECK_DEV to authorize this check
        required: true
        type: string
      min_rows:
        description: Minimum recent inference rows required before comparing (default 30)
        required: false
        type: string
      min_drifted_features:
        description: Number of features that must clear both gates before DRIFT_DETECTED fires (default 1)
        required: false
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  check-drift:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce cost-aware cloud authorization
        env:
          AUTHORIZATION: ${{ inputs.cloud_compute_authorization }}
        run: test "$AUTHORIZATION" = "RUN_AZURE_DRIFT_CHECK_DEV"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: |
          az extension add --name ml --version 2.44.1 --yes
          python -m pip install azure-identity==1.19.0 azure-storage-blob==12.24.1 scipy==1.14.1 pandas==2.2.3 pyarrow==17.0.0
      - id: context
        run: |
          STORAGE_ID=$(az ml workspace show -g "rg-azure-ai-ml-ops-dev" -n "mlw-azure-ai-ml-ops-dev" --query storage_account -o tsv --only-show-errors)
          echo "storage=${STORAGE_ID##*/}" >> "$GITHUB_OUTPUT"
      - id: check
        continue-on-error: true
        env:
          MIN_ROWS: ${{ inputs.min_rows }}
          MIN_DRIFTED_FEATURES: ${{ inputs.min_drifted_features }}
        run: |
          ARGS=(--storage-account "${{ steps.context.outputs.storage }}" --container monitoring)
          [ -n "$MIN_ROWS" ] && ARGS+=(--min-rows "$MIN_ROWS")
          [ -n "$MIN_DRIFTED_FEATURES" ] && ARGS+=(--min-drifted-features "$MIN_DRIFTED_FEATURES")
          python data-science/src/check_drift.py "${ARGS[@]}" | tee /tmp/drift-output.txt
          STATUS=$(grep -o 'MONITORING_STATUS=.*' /tmp/drift-output.txt | tail -1 | cut -d= -f2)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Record drift-check evidence
        if: always()
        env:
          DRIFT_STATUS: ${{ steps.check.outputs.status || 'unknown' }}
        run: |
          python scripts/emit_evidence.py --storage-account "${{ steps.context.outputs.storage }}" \
            --operation-id "drift-${{ github.run_id }}" --provider azure_ml --capability ml \
            --operation drift_check --state "${{ steps.check.outcome == 'success' && 'succeeded' || 'failed' }}" \
            --source-run-id "${{ github.run_id }}" --source-sequence 0 \
            --metadata "{\"drift_status\": \"$DRIFT_STATUS\"}"
      - if: steps.check.outcome != 'success'
        run: exit 1
