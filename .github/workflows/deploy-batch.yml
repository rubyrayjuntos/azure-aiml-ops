name: Deploy and invoke explicit model version
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Immutable registered model version
        required: true
        type: string
      input_data_uri:
        description: Azure ML or Azure Storage URI for batch input
        required: true
        type: string
      cloud_compute_authorization:
        description: Type RUN_AZURE_BATCH_DEV to authorize charged Azure compute
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce cost-aware cloud authorization
        env:
          AUTHORIZATION: ${{ inputs.cloud_compute_authorization }}
        run: test "$AUTHORIZATION" = "RUN_AZURE_BATCH_DEV"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: |
          az extension add --name ml --version 2.44.1 --yes
          python -m pip install azure-identity==1.19.0 azure-storage-blob==12.24.1
      - id: context
        run: |
          STORAGE_ID=$(az ml workspace show -g "rg-azure-ai-ml-ops-dev" -n "mlw-azure-ai-ml-ops-dev" --query storage_account -o tsv --only-show-errors)
          echo "storage=${STORAGE_ID##*/}" >> "$GITHUB_OUTPUT"
      - name: Record started evidence
        run: >-
          python scripts/emit_evidence.py --storage-account "${{ steps.context.outputs.storage }}"
          --operation-id "batch-${{ github.run_id }}" --provider azure_ml_batch --capability serving
          --operation batch_serving --state started --source-run-id "${{ github.run_id }}" --source-sequence 0
      - id: deploy
        continue-on-error: true
        run: |
          az ml batch-endpoint create -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --file mlops/azureml/deploy/batch/endpoint.yml
          az ml batch-deployment create -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --file mlops/azureml/deploy/batch/deployment.yml --set model="azureml:azure-ai-ml-ops-model:${{ inputs.model_version }}" --set environment_variables.MONITORING_STORAGE_ACCOUNT="${{ steps.context.outputs.storage }}"
          JOB_ID=$(az ml batch-endpoint invoke -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --name "azure-ai-ml-ops-batch" --input "${{ inputs.input_data_uri }}" --input-type uri_file --query name -o tsv --only-show-errors)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          az ml job stream -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --name "$JOB_ID"
      - name: Record terminal evidence
        if: always()
        run: >-
          python scripts/emit_evidence.py --storage-account "${{ steps.context.outputs.storage }}"
          --operation-id "batch-${{ github.run_id }}" --provider azure_ml_batch --capability serving
          --operation batch_serving --state "${{ steps.deploy.outcome == 'success' && 'succeeded' || 'failed' }}"
          --source-run-id "${{ github.run_id }}" --source-sequence 1
          --artifact "model=azureml:azure-ai-ml-ops-model:${{ inputs.model_version }}"
          --artifact "azure_ml_job=azureml://jobs/${{ steps.deploy.outputs.job_id }}"
      - if: steps.deploy.outcome != 'success'
        run: exit 1
