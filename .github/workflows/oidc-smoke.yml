name: Azure OIDC smoke
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  read-only-proof:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install provenance verifier dependency
        run: python -m pip install -c constraints.txt pyyaml
      - id: provenance
        run: python scripts/verify_generation.py --github-output
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: identity
        name: Verify exchanged-token identity without printing the token
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          EXPECTED_OBJECT_ID: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          az account get-access-token --query accessToken -o tsv | python -c '
          import base64, json, os, sys
          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected = {
              "appid": os.environ["EXPECTED_CLIENT_ID"].lower(),
              "oid": os.environ["EXPECTED_OBJECT_ID"].lower(),
              "tid": os.environ["EXPECTED_TENANT_ID"].lower(),
          }
          actual = {key: str(claims.get(key, "")).lower() for key in expected}
          if actual != expected:
              raise SystemExit("exchanged token identity does not match the intended deployment principal")
          print("OIDC token identity matched expected client, object, and tenant IDs.")
          '
      - name: Verify intended read scopes
        run: |
          az account show --query '{tenant:tenantId,subscription:id,userType:user.type}' -o json
          az group show --name "rg-azure-ai-ml-ops-dev" --query '{id:id,location:location}' -o json
          az storage blob list \
            --auth-mode login \
            --account-name "stazmlops0001devtf" \
            --container-name "azure-ai-ml-ops-r1" \
            --num-results 1 \
            --query 'length(@)' -o tsv >/dev/null
      - name: Prove management-plane denial outside the Dev boundary
        run: |
          if az group show --name "rg-azmlops-0001dev-tf" --only-show-errors >/dev/null 2>&1; then
            echo "Deployment identity unexpectedly has management-plane visibility outside the Dev resource group." >&2
            exit 1
          fi
          echo "Out-of-scope backend resource-group management read was denied as expected."
      - name: Record nonmutating evidence summary
        env:
          GENERATION_ID: ${{ steps.provenance.outputs.generation_id }}
        run: |
          {
            echo "### Azure OIDC read-only proof"
            echo "- Generation ID: \`$GENERATION_ID\`"
            echo "- Environment: \`dev\`"
            echo "- Token exchange: exercised"
            echo "- Dev resource-group read: passed"
            echo "- Dedicated backend-container data read: passed"
            echo "- Out-of-scope management read: denied"
            echo "- Terraform mutation: not exercised"
          } >> "$GITHUB_STEP_SUMMARY"
