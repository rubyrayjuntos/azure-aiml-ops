name: Train evaluate and conditionally register
on:
  workflow_dispatch:
    inputs:
      champion_metric:
        description: Explicit metric for the approved champion; use -1 when none exists
        required: true
        default: "-1"
      cloud_compute_authorization:
        description: Type RUN_AZURE_TRAINING_DEV to authorize charged Azure compute
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  train:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce cost-aware cloud authorization
        env:
          AUTHORIZATION: ${{ inputs.cloud_compute_authorization }}
        run: test "$AUTHORIZATION" = "RUN_AZURE_TRAINING_DEV"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: |
          az extension add --name ml --version 2.33.1 --yes
          python -m pip install azure-identity==1.19.0 azure-storage-blob==12.24.1
      - id: context
        run: |
          STORAGE_ID=$(az ml workspace show -g "rg-azure-ai-ml-ops-dev" -n "mlw-azure-ai-ml-ops-dev" --query storage_account -o tsv)
          echo "storage=${STORAGE_ID##*/}" >> "$GITHUB_OUTPUT"
      - name: Record started evidence
        run: >-
          python scripts/emit_evidence.py --storage-account "${{ steps.context.outputs.storage }}"
          --operation-id "train-${{ github.run_id }}" --provider azure_ml --capability ml
          --operation training --state started --source-run-id "${{ github.run_id }}" --source-sequence 0
      - name: Register environment and dataset
        run: |
          az ml environment create -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --file mlops/azureml/train/train-env.yml
          az ml data create -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --name "azure-ai-ml-ops-training-data" --version "${{ github.run_number }}" --type uri_file --path data/train.csv
      - id: submit
        continue-on-error: true
        run: |
          RUN_ID=$(az ml job create -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --file mlops/azureml/train/pipeline.yml --set inputs.input.path="azureml:azure-ai-ml-ops-training-data:${{ github.run_number }}" inputs.champion_metric="${{ inputs.champion_metric }}" --query name -o tsv)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          az ml job stream -g "rg-azure-ai-ml-ops-dev" -w "mlw-azure-ai-ml-ops-dev" --name "$RUN_ID"
      - name: Record terminal evidence
        if: always()
        run: >-
          python scripts/emit_evidence.py --storage-account "${{ steps.context.outputs.storage }}"
          --operation-id "train-${{ github.run_id }}" --provider azure_ml --capability ml
          --operation training --state "${{ steps.submit.outcome == 'success' && 'succeeded' || 'failed' }}"
          --source-run-id "${{ github.run_id }}" --source-sequence 1
          --artifact "azure_ml_job=azureml://jobs/${{ steps.submit.outputs.run_id }}"
      - if: steps.submit.outcome != 'success'
        run: exit 1
