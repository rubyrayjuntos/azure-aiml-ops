name: Terraform plan
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  plan:
    environment: dev
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install provenance verifier dependency
        run: python -m pip install -c constraints.txt pyyaml
      - id: provenance
        name: Verify immutable generation provenance
        run: python scripts/verify_generation.py --github-output
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
      - name: Initialize
        run: terraform -chdir=infra/terraform init -backend-config=backend-dev.hcl
      - name: Plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_workflow_principal_object_id: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
        run: |
          mkdir -p "${RUNNER_TEMP}/plan-artifact"
          terraform -chdir=infra/terraform plan -out="${RUNNER_TEMP}/plan-artifact/r1.tfplan"
          terraform -chdir=infra/terraform show -json "${RUNNER_TEMP}/plan-artifact/r1.tfplan" > "${RUNNER_TEMP}/r1-plan.raw.json"
      - id: approval
        name: Create and verify immutable review artifact
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          python scripts/plan_artifact.py create \
            --artifact-dir "${RUNNER_TEMP}/plan-artifact" \
            --terraform-dir infra/terraform \
            --plan "${RUNNER_TEMP}/plan-artifact/r1.tfplan" \
            --raw-json "${RUNNER_TEMP}/r1-plan.raw.json" \
            --generation-receipt generation-receipt.json \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --tenant-id "$AZURE_TENANT_ID" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --environment "dev" \
            --backend-resource-group "rg-azmlops-0001dev-tf" \
            --backend-storage-account "stazmlops0001devtf" \
            --backend-container "azure-ai-ml-ops-r1" \
            --state-key "azure-ai-ml-ops-dev.tfstate"
          plan_digest="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/plan-artifact/r1.tfplan.sha256")"
          echo "plan_digest=$plan_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan approval contract"
            echo "- Plan digest: \`$plan_digest\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Generation ID: \`${{ steps.provenance.outputs.generation_id }}\`"
            echo "- Environment: \`dev\`"
            echo "- Artifact schema: \`1.0\`"
            echo "- Apply requires a separate manual dispatch with this run ID and digest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish reviewed-plan candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Explain evidence boundary
        run: echo "The plan is immutable and unapplied. Project-local evidence begins after the storage account exists; this workflow's artifact and metadata are the approval evidence."
