name: Terraform plan
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  plan:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install provenance verifier dependency
        run: python -m pip install -c constraints.txt pyyaml==6.0.3
      - id: provenance
        name: Verify immutable generation provenance
        run: python scripts/verify_generation.py --github-output
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
      - name: Initialize
        run: terraform -chdir=infra/terraform init -backend-config=backend-dev.hcl
      - name: Plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_workflow_principal_object_id: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
        run: terraform -chdir=infra/terraform plan -out=r1.tfplan
      - id: approval
        name: Create immutable approval metadata
        env:
          GENERATION_ID: ${{ steps.provenance.outputs.generation_id }}
          MANIFEST_DIGEST: ${{ steps.provenance.outputs.manifest_digest }}
          RESOLVED_PLAN_DIGEST: ${{ steps.provenance.outputs.resolved_plan_digest }}
          TARGET_ENVIRONMENT: "dev"
        run: |
          plan_digest="sha256:$(sha256sum infra/terraform/r1.tfplan | cut -d ' ' -f 1)"
          export PLAN_DIGEST="$plan_digest"
          echo "plan_digest=$plan_digest" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "approval_contract_version": "1.0",
              "source_commit": os.environ["GITHUB_SHA"],
              "generation_id": os.environ["GENERATION_ID"],
              "manifest_digest": os.environ["MANIFEST_DIGEST"],
              "resolved_plan_digest": os.environ["RESOLVED_PLAN_DIGEST"],
              "target_environment": os.environ["TARGET_ENVIRONMENT"],
              "terraform_plan_digest": os.environ["PLAN_DIGEST"],
              "plan_run_id": os.environ["GITHUB_RUN_ID"],
              "plan_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "plan_requested_by": os.environ["GITHUB_ACTOR"],
              "plan_producer": "github-actions",
              "independent_human_reviewer_required": False,
          }
          Path("infra/terraform/approval-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          {
            echo "### Terraform plan approval contract"
            echo "- Plan digest: \`$plan_digest\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Generation ID: \`${GENERATION_ID}\`"
            echo "- Environment: \`dev\`"
            echo "- Apply requires a separate manual dispatch with this run ID and digest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish reviewed-plan candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/terraform/r1.tfplan
            infra/terraform/approval-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Explain evidence boundary
        run: echo "The plan is immutable and unapplied. Project-local evidence begins after the storage account exists; this workflow's artifact and metadata are the approval evidence."
